spring.application.name=backend
# 1. Configurare Conexiune MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/eduquizz_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password= 
# ^ Dacă ai parolă la MySQL (ex: "root" sau "1234"), scrie-o mai sus după egal. 
# Dacă folosești XAMPP default, las-o goală.

# 2. Driverul (spune-i lui Java să folosească MySQL)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 3. MAGIA JPA / Hibernate (Partea importantă)
# "update" înseamnă: Dacă tabelul nu există, fă-l. Dacă există, actualizează-l (nu șterge datele).
spring.jpa.hibernate.ddl-auto=create-drop

# 4. Afișează SQL-ul în consolă (ca să vezi ce face Hibernate în spate)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 5. Dialectul (ajută Hibernate să vorbească "limba" corectă de MySQL 8)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect