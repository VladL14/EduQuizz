<div class="min-h-screen flex items-center justify-center bg-gray-100 px-4">
  
  <div class="max-w-md w-full bg-white shadow-lg rounded-xl p-8 space-y-6">
    
    <div class="text-center">
      <h2 class="text-3xl font-extrabold text-gray-900">EduQuizz</h2>
      <p class="mt-2 text-sm text-gray-600">
        Intra in contul tau
      </p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-4">
      
      <div>
        <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
        <div class="mt-1">
          <input id="email" name="email" type="email" formControlName="email" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all" placeholder="student@exemplu.com">
        </div>
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-gray-700">Parola</label>
        <div class="mt-1">
          <input id="password" name="password" type="password" formControlName="password" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all" placeholder="••••••••">
        </div>
      </div>

      <div>
        <button 
          type="submit" 
          class="w-full flex justify-center py-2 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-colors">
          Autentificare
        </button>
      </div>

    </form>

    <div class="text-center text-sm">
      <span class="text-gray-600">Nu ai cont?</span>
      <a routerLink="/register" class="font-medium text-indigo-600 hover:text-indigo-500 ml-1 cursor-pointer">
        Inregistreaza-te
      </a>
    </div>

  </div>
</div>
