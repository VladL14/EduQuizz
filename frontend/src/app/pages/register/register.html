<div class="min-h-screen flex items-center justify-center bg-gray-100 px-4">
  <div class="max-w-md w-full bg-white shadow-lg rounded-xl p-8 space-y-6">
    
    <div class="text-center">
      <h2 class="text-3xl font-extrabold text-gray-900">EduQuizz</h2>
      <p class="mt-2 text-sm text-gray-600">Creare cont student</p>
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="space-y-4">
      
      <div>
        <label class="block text-sm font-medium text-gray-700">Username</label>
        <div class="mt-1">
          <input 
            type="text" 
            formControlName="username"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-indigo-500"
            placeholder="Username">
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Email</label>
        <div class="mt-1">
          <input 
            type="email" 
            formControlName="email"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-indigo-500"
            placeholder="student@exemplu.com">
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Parola</label>
        <div class="mt-1">
          <input 
            type="password" 
            formControlName="password"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-indigo-500"
            placeholder="Parola">
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Confirma parola</label>
        <div class="mt-1">
          <input 
            type="password" 
            formControlName="confirmPassword"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-indigo-500"
            placeholder="Confirma parola">
        </div>
      </div>

      <div>
        <button 
          type="submit"
          class="w-full flex justify-center py-2 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 transition-colors">
          Creeaza Cont
        </button>
      </div>

    </form>

    <div class="text-center text-sm">
      <span class="text-gray-600">Ai deja cont?</span>
      <a routerLink="/login" class="font-medium text-indigo-600 hover:text-indigo-500 ml-1 cursor-pointer">
        Autentifica-te
      </a>
    </div>

  </div>
</div>
