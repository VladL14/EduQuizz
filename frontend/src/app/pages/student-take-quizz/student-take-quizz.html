<div *ngIf="quiz" class="sticky top-0 z-50 bg-white/95 backdrop-blur shadow-md border-b border-gray-200 px-6 py-3 flex justify-between items-center transition-all">
  <div>
    <h1 class="text-lg md:text-xl font-bold text-gray-800 leading-tight">{{ quiz.title }}</h1>
    <p class="text-xs text-gray-500 font-medium">Timp total: {{ quiz.timeLimit }} min</p>
  </div>

  <div class="flex items-center gap-3 px-4 py-2 rounded-lg border-2 font-mono text-xl font-bold shadow-sm"
       [ngClass]="{
            'border-gray-200 bg-gray-50 text-gray-700': !isTimeCritical,
            'border-red-300 bg-red-50 text-red-600 animate-pulse': isTimeCritical
         }">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6">
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z" />
    </svg>
    <span>{{ timerString }}</span>
  </div>
</div>

<div *ngIf="isLoading" class="text-center py-20">
  <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-indigo-600 mx-auto mb-4"></div>
  <p class="text-gray-500">Se pregătește testul...</p>
</div>

<div *ngIf="errorMessage" class="max-w-4xl mx-auto mt-8 p-4 bg-red-50 border border-red-200 text-red-700 rounded-lg text-center">
  {{ errorMessage }}
</div>

<div class="max-w-4xl mx-auto p-6 pb-24" *ngIf="!isLoading && !errorMessage && quiz">

  <div *ngFor="let q of quiz.questions; let i = index" class="mb-8 bg-white p-6 rounded-xl shadow-sm border border-gray-200">

    <div class="flex justify-between items-start mb-4 border-b border-gray-100 pb-4">
      <h3 class="font-bold text-lg text-gray-800">
        <span class="text-indigo-600 mr-2">Q{{ i + 1 }}.</span>
        {{ q.text }}
      </h3>
      <span class="bg-indigo-50 text-indigo-700 text-xs font-bold px-2.5 py-1 rounded border border-indigo-100 whitespace-nowrap">
                {{ q.points }} pct
            </span>
    </div>

    <div *ngIf="q.type === RequestType.GRID" class="space-y-3">
      <div *ngFor="let opt of q.options" class="flex items-center p-3 rounded-lg border border-gray-200 hover:bg-gray-50 transition-colors cursor-pointer">
        <input type="checkbox"
               [id]="'opt-' + opt.id"
               (change)="toggleOption(q.id, opt.id, $event)"
               [checked]="gridAnswers[q.id]?.has(opt.id)"
               class="w-5 h-5 text-indigo-600 rounded border-gray-300 focus:ring-indigo-500 cursor-pointer">
        <label [for]="'opt-' + opt.id" class="ml-3 text-gray-700 font-medium cursor-pointer w-full select-none">
          {{ opt.text }}
        </label>
      </div>
    </div>

    <div *ngIf="q.type === RequestType.TEXT">
            <textarea
              [(ngModel)]="textAnswers[q.id]"
              class="w-full h-32 p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none resize-y text-gray-700"
              placeholder="Scrie răspunsul tău aici..."></textarea>
    </div>

    <div *ngIf="q.type === RequestType.CODE">
      <div class="bg-gray-900 rounded-t-lg p-2 flex justify-between items-center">
        <span class="text-gray-400 text-xs font-mono pl-2">Python Editor</span>
        <button (click)="runCode(q.id)"
                [disabled]="isRunning[q.id]"
                class="bg-green-600 hover:bg-green-700 text-white text-xs px-3 py-1.5 rounded flex items-center gap-1 transition-colors disabled:opacity-50">
          <span *ngIf="!isRunning[q.id]">▶ Rulează</span>
          <span *ngIf="isRunning[q.id]">Se execută...</span>
        </button>
      </div>

      <textarea
        [(ngModel)]="textAnswers[q.id]"
        class="w-full h-48 p-4 bg-gray-800 text-green-400 font-mono text-sm focus:outline-none border-x border-gray-700 resize-y"
        placeholder="def solution(): ..."></textarea>

      <div class="bg-black rounded-b-lg p-4 border-t border-gray-700">
        <p class="text-gray-500 text-xs uppercase font-bold mb-1">Output Consolă:</p>
        <pre class="text-gray-300 font-mono text-sm whitespace-pre-wrap min-h-[40px]">{{ consoleOutputs[q.id] || 'Așteptare execuție...' }}</pre>
      </div>
    </div>

  </div>

  <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 p-4 flex justify-center shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)] z-40">
    <button (click)="submitQuiz(false)"
            class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-8 rounded-xl shadow-lg transform active:scale-95 transition-all text-lg flex items-center gap-2">
      <span>Trimite Testul</span>
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 12L3.269 3.126A59.768 59.768 0 0121.485 12 59.77 59.77 0 013.27 20.876L5.999 12zm0 0h7.5" />
      </svg>
    </button>
  </div>

</div>
